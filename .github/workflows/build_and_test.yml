name: Build and Test

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'goreleaser.yaml'
      - 'winres/**'
      - 'tests/**'
      - '.github/workflows/**'

# Single gating workflow. Jobs flow:
#
#   test    → static checks and unit tests on Linux.
#   build   → goreleaser snapshot (the same pipeline `make build` runs),
#             uploaded so the Linux amd64 package job can install the
#             real artifacts without rebuilding.
#   per-platform jobs → native binary install + command coverage, each
#             gated on `test`. The Linux amd64 package install job is
#             gated on `build` because it needs the .deb/.rpm/.apk.
#
# Using `needs:` instead of `workflow_run` keeps the platform jobs
# reliably triggered on every PR — `workflow_run` has too many quirks
# (PR fork events, default-branch-only file resolution) to depend on
# for required-status gating.

jobs:
  test:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run static checks and unit tests
        run: go run ./build/test

  build:
    name: Goreleaser snapshot build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Run goreleaser snapshot
        run: go run ./build

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-packages
          path: .output/release/conch_*_amd64.*
          if-no-files-found: error
          retention-days: 1

  linux_amd64_binary_and_commands:
    name: Binary install and command coverage on Linux amd64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Show platform banner
        run: |
          printf '\033[1;36m========================================\n'
          printf '  Binary install on Linux amd64\n'
          printf '========================================\033[0m\n'

      - name: Build conch for Linux amd64
        run: go build -o conch ./cmd/conch

      - name: Install conch onto PATH
        run: |
          set -euxo pipefail
          sudo install -m 0755 conch /usr/local/bin/conch
          which conch
          conch --version

      - name: Scaffold test fixtures into RUNNER_TEMP
        run: |
          set -euxo pipefail
          for f in tests/*.toml; do
            name=$(basename "$f" .toml)
            mkdir -p "$RUNNER_TEMP/$name"
            cp "$f" "$RUNNER_TEMP/$name/conch.toml"
          done

      - name: Install cross-platform environment
        working-directory: ${{ runner.temp }}/agnostic
        run: conch install --min-ui

      - name: Check that conch added .conch/ to .gitignore
        working-directory: ${{ runner.temp }}/agnostic
        run: |
          set -euxo pipefail
          test -f .gitignore
          grep -Fxq '.conch/' .gitignore

      - name: Install Linux amd64 environment
        working-directory: ${{ runner.temp }}/linux-amd64
        run: conch install --min-ui

      # -- summary across every output format --------------------------------
      - name: Print summary in human-readable form
        working-directory: ${{ runner.temp }}/agnostic
        run: conch summary

      - name: Export summary as JSON
        working-directory: ${{ runner.temp }}/agnostic
        run: conch summary --format json

      - name: Export summary as YAML
        working-directory: ${{ runner.temp }}/agnostic
        run: conch summary --format yaml

      - name: Export summary as TOML
        working-directory: ${{ runner.temp }}/agnostic
        run: conch summary --format toml

      - name: Export summary as XML
        working-directory: ${{ runner.temp }}/agnostic
        run: conch summary --format xml

      # -- tasks across every output format ----------------------------------
      - name: List tasks in human-readable form
        working-directory: ${{ runner.temp }}/agnostic
        run: conch tasks

      - name: Export tasks as JSON
        working-directory: ${{ runner.temp }}/agnostic
        run: conch tasks --format json

      - name: Export tasks as YAML
        working-directory: ${{ runner.temp }}/agnostic
        run: conch tasks --format yaml

      - name: Export tasks as TOML
        working-directory: ${{ runner.temp }}/agnostic
        run: conch tasks --format toml

      - name: Export tasks as XML
        working-directory: ${{ runner.temp }}/agnostic
        run: conch tasks --format xml

      # -- run under both UI modes -------------------------------------------
      - name: Run hello task with min UI
        working-directory: ${{ runner.temp }}/agnostic
        run: conch run hello --min-ui

      - name: Run PowerShell version task with default UI
        working-directory: ${{ runner.temp }}/agnostic
        run: conch run psversion

  linux_amd64_package_install:
    name: Package install on Linux amd64
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux release artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-packages
          path: .output/release

      - name: Show deb banner
        run: |
          printf '\033[1;32m================================\n'
          printf '  Install deb package on Ubuntu\n'
          printf '================================\033[0m\n'

      - name: Install deb package on Ubuntu and verify PATH
        run: |
          set -euxo pipefail
          sudo dpkg -i .output/release/conch_*_amd64.deb
          which conch
          conch --version

      - name: Show rpm banner
        run: |
          printf '\033[1;31m======================================\n'
          printf '  Install rpm package on Rocky Linux 9\n'
          printf '======================================\033[0m\n'

      - name: Install rpm package on Rocky Linux 9 and verify PATH
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${PWD}:/work" \
            -w /work \
            rockylinux:9 \
            sh -c '
              set -eux
              dnf install -y /work/.output/release/conch_*_amd64.rpm
              which conch
              conch --version
            '

      - name: Show apk banner
        run: |
          printf '\033[1;35m================================\n'
          printf '  Install apk package on Alpine\n'
          printf '================================\033[0m\n'

      - name: Install apk package on Alpine and verify PATH
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${PWD}:/work" \
            -w /work \
            alpine:latest \
            sh -c '
              set -eux
              apk add --allow-untrusted /work/.output/release/conch_*_amd64.apk
              which conch
              conch --version
            '

  linux_arm64_binary_install:
    name: Binary install on Linux arm64
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Show platform banner
        run: |
          printf '\033[1;35m========================================\n'
          printf '  Binary install on Linux arm64\n'
          printf '========================================\033[0m\n'

      - name: Build conch for Linux arm64
        run: go build -o conch ./cmd/conch

      - name: Install conch onto PATH
        run: |
          set -euxo pipefail
          sudo install -m 0755 conch /usr/local/bin/conch
          which conch
          conch --version

      - name: Scaffold test fixtures into RUNNER_TEMP
        run: |
          set -euxo pipefail
          for f in tests/*.toml; do
            name=$(basename "$f" .toml)
            mkdir -p "$RUNNER_TEMP/$name"
            cp "$f" "$RUNNER_TEMP/$name/conch.toml"
          done

      - name: Install cross-platform environment
        working-directory: ${{ runner.temp }}/agnostic
        run: conch install --min-ui

      - name: Check that conch added .conch/ to .gitignore
        working-directory: ${{ runner.temp }}/agnostic
        run: |
          set -euxo pipefail
          test -f .gitignore
          grep -Fxq '.conch/' .gitignore

      - name: Install Linux arm64 environment
        working-directory: ${{ runner.temp }}/linux-arm64
        run: conch install --min-ui

  windows_amd64_binary_install:
    name: Binary install on Windows amd64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Show platform banner
        shell: pwsh
        run: |
          $esc = [char]27
          Write-Host -Object "$esc[1;34m========================================"
          Write-Host -Object "  Binary install on Windows amd64"
          Write-Host -Object "========================================$esc[0m"

      - name: Build conch for Windows amd64
        shell: pwsh
        run: go build -o conch.exe ./cmd/conch

      - name: Install conch onto PATH
        shell: pwsh
        run: |
          $bin = Join-Path -Path $env:USERPROFILE -ChildPath ".conch-bin"
          $conchExe = Join-Path -Path $bin -ChildPath "conch.exe"

          New-Item -Path $bin -ItemType Directory -Force > $null
          Copy-Item -Path "conch.exe" -Destination $conchExe -Force
          Add-Content -Path $env:GITHUB_PATH -Value $bin

          $env:PATH = "$bin;$env:PATH"
          Get-Command -Name conch | Format-List -Property Name, Source
          conch --version

      - name: Scaffold test fixtures into RUNNER_TEMP
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem -Path tests -Filter *.toml) {
              $name = $f.BaseName
              $dest = Join-Path -Path $env:RUNNER_TEMP -ChildPath $name
              $conchToml = Join-Path -Path $dest -ChildPath "conch.toml"

              New-Item -Path $dest -ItemType Directory -Force > $null
              Copy-Item -Path $f.FullName -Destination $conchToml -Force
          }

      - name: Install cross-platform environment
        working-directory: ${{ runner.temp }}/agnostic
        run: conch install --min-ui

      - name: Check that conch added .conch/ to .gitignore
        working-directory: ${{ runner.temp }}/agnostic
        shell: pwsh
        run: |
          if (-not (Test-Path -Path .gitignore)) {
              throw ".gitignore was not created"
          }

          $lines = Get-Content -Path .gitignore
          if ($lines -notcontains '.conch/') {
              throw ".gitignore does not list .conch/"
          }

      - name: Install Windows amd64 environment
        working-directory: ${{ runner.temp }}/windows-amd64
        run: conch install --min-ui

  windows_arm64_binary_install:
    name: Binary install on Windows arm64
    needs: test
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Show platform banner
        shell: pwsh
        run: |
          $esc = [char]27
          Write-Host -Object "$esc[1;33m========================================"
          Write-Host -Object "  Binary install on Windows arm64"
          Write-Host -Object "========================================$esc[0m"

      - name: Build conch for Windows arm64
        shell: pwsh
        run: go build -o conch.exe ./cmd/conch

      - name: Install conch onto PATH
        shell: pwsh
        run: |
          $bin = Join-Path -Path $env:USERPROFILE -ChildPath ".conch-bin"
          $conchExe = Join-Path -Path $bin -ChildPath "conch.exe"

          New-Item -Path $bin -ItemType Directory -Force > $null
          Copy-Item -Path "conch.exe" -Destination $conchExe -Force
          Add-Content -Path $env:GITHUB_PATH -Value $bin

          $env:PATH = "$bin;$env:PATH"
          Get-Command -Name conch | Format-List -Property Name, Source
          conch --version

      - name: Scaffold test fixtures into RUNNER_TEMP
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem -Path tests -Filter *.toml) {
              $name = $f.BaseName
              $dest = Join-Path -Path $env:RUNNER_TEMP -ChildPath $name
              $conchToml = Join-Path -Path $dest -ChildPath "conch.toml"

              New-Item -Path $dest -ItemType Directory -Force > $null
              Copy-Item -Path $f.FullName -Destination $conchToml -Force
          }

      - name: Install cross-platform environment
        working-directory: ${{ runner.temp }}/agnostic
        run: conch install --min-ui

      - name: Check that conch added .conch/ to .gitignore
        working-directory: ${{ runner.temp }}/agnostic
        shell: pwsh
        run: |
          if (-not (Test-Path -Path .gitignore)) {
              throw ".gitignore was not created"
          }

          $lines = Get-Content -Path .gitignore
          if ($lines -notcontains '.conch/') {
              throw ".gitignore does not list .conch/"
          }

      - name: Install Windows arm64 environment
        working-directory: ${{ runner.temp }}/windows-arm64
        run: conch install --min-ui
