name: Integration Tests

on:
  pull_request:
    paths:
      # Source — anything the Go toolchain compiles.
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      # Build inputs — goreleaser config and the Windows resource file
      # that go-winres embeds into the conch.exe binaries.
      - 'goreleaser.yaml'
      - 'winres/**'
      # CI fixtures — the manifests this workflow drives `conch install`
      # against.
      - 'tests/**'
      # The workflow itself, so iteration on it actually runs.
      - '.github/workflows/integration.yml'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint, vet, and Go unit tests. Mirrors `make test` (go vet, gofmt -l,
  # go test ./...) via the build/test driver — same checks CI would run.
  # ---------------------------------------------------------------------------
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run static checks and unit tests
        run: go run ./build/test

  # ---------------------------------------------------------------------------
  # 2. Single source-of-truth build. goreleaser cross-compiles every supported
  # OS/arch into .output/, so downstream jobs only need to download artifacts
  # — they never rebuild. Runs on windows-latest because chocolatey is
  # preinstalled there, letting goreleaser produce the .nupkg without extra
  # tooling.
  # ---------------------------------------------------------------------------
  build:
    name: Build cross-platform artifacts
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Build cross-platform binaries and packages
        run: go run ./build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conch-output
          path: .output/
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Linux native-package installs. Each entry takes the package goreleaser
  # produced, installs it on a distro that natively understands the format,
  # then asserts `which conch` resolves — proving the package wired the
  # binary into PATH.
  # ---------------------------------------------------------------------------
  linux-package-install:
    name: Linux package install — ${{ matrix.label }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "deb (Ubuntu)"
            pkg: deb
            color: "32"
            image: ""
          - label: "rpm (Rocky Linux 9)"
            pkg: rpm
            color: "31"
            image: rockylinux:9
          - label: "apk (Alpine)"
            pkg: apk
            color: "36"
            image: alpine:latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: conch-output
          path: .output

      - name: Show package banner
        run: |
          printf '\033[1;${{ matrix.color }}m========================================\n'
          printf '  Linux package install — %s\n' '${{ matrix.label }}'
          printf '========================================\033[0m\n'

      - name: Install package and verify PATH
        if: matrix.pkg == 'deb'
        run: |
          set -euxo pipefail
          sudo dpkg -i .output/release/conch_*_amd64.deb
          which conch
          conch --version

      - name: Install package and verify PATH
        if: matrix.pkg == 'rpm'
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${PWD}:/work" \
            -w /work \
            ${{ matrix.image }} \
            sh -c '
              set -eux
              dnf install -y /work/.output/release/conch_*_amd64.rpm
              which conch
              conch --version
            '

      - name: Install package and verify PATH
        if: matrix.pkg == 'apk'
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${PWD}:/work" \
            -w /work \
            ${{ matrix.image }} \
            sh -c '
              set -eux
              apk add --allow-untrusted /work/.output/release/conch_*_amd64.apk
              which conch
              conch --version
            '

  # ---------------------------------------------------------------------------
  # 4. Cross-platform binary smoke test. For each supported OS/arch, copy
  # the matching binary out of .output/bin/ onto PATH and drive `conch install
  # --min-ui` against:
  #   - the platform-agnostic fixture (must succeed everywhere)
  #   - the matching platform-locked fixture (must succeed only here)
  # This isolates the binary itself — no package managers involved.
  # ---------------------------------------------------------------------------
  binary-install:
    name: Binary install — ${{ matrix.label }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Linux / amd64"
            runner: ubuntu-latest
            os: linux
            arch: amd64
            color: "36"
            fixture: linux-amd64
          - label: "Linux / arm64"
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            color: "35"
            fixture: linux-arm64
          - label: "Windows / amd64"
            runner: windows-latest
            os: windows
            arch: amd64
            color: "34"
            fixture: windows-amd64
          - label: "Windows / arm64"
            runner: windows-11-arm
            os: windows
            arch: arm64
            color: "33"
            fixture: windows-arm64
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: conch-output
          path: .output

      - name: Show platform banner
        if: matrix.os == 'linux'
        run: |
          printf '\033[1;${{ matrix.color }}m========================================\n'
          printf '  Binary install — %s\n' '${{ matrix.label }}'
          printf '========================================\033[0m\n'

      - name: Show platform banner
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $esc = [char]27
          Write-Host -Object "$esc[1;${{ matrix.color }}m========================================"
          Write-Host -Object "  Binary install — ${{ matrix.label }}"
          Write-Host -Object "========================================$esc[0m"

      - name: Install conch onto PATH
        if: matrix.os == 'linux'
        run: |
          set -euxo pipefail
          src=$(ls .output/bin/conch_${{ matrix.os }}_${{ matrix.arch }}*/conch)
          sudo install -m 0755 "$src" /usr/local/bin/conch
          which conch
          conch --version

      - name: Install conch onto PATH
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $src = Get-ChildItem -Path ".output/bin/conch_${{ matrix.os }}_${{ matrix.arch }}*/conch.exe" -Recurse |
              select -First 1 -Expand FullName
          if (-not $src) {
              throw "conch.exe not found under .output/bin"
          }

          $bin = Join-Path -Path $env:USERPROFILE -ChildPath ".conch-bin"
          $conchExe = Join-Path -Path $bin -ChildPath "conch.exe"

          New-Item -Path $bin -ItemType Directory -Force > $null
          Copy-Item -Path $src -Destination $conchExe -Force
          Add-Content -Path $env:GITHUB_PATH -Value $bin

          $env:PATH = "$bin;$env:PATH"
          Get-Command -Name conch | Format-List -Property Name, Source
          conch --version

      - name: Install cross-platform environment
        working-directory: .output/tests/agnostic
        run: conch install --min-ui

      - name: Install platform-locked environment
        working-directory: .output/tests/${{ matrix.fixture }}
        run: conch install --min-ui

  # ---------------------------------------------------------------------------
  # 5. Command coverage. Once an environment exists, exercise the rest of the
  # CLI surface — summary in every format, tasks in every format, task
  # execution under both UI modes. One runner is enough; we're testing
  # commands, not portability, and the binary-install matrix already proved
  # the binary works on every platform.
  # ---------------------------------------------------------------------------
  command-coverage:
    name: Command coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: conch-output
          path: .output

      - name: Install conch onto PATH
        run: |
          set -euxo pipefail
          src=$(ls .output/bin/conch_linux_amd64*/conch)
          sudo install -m 0755 "$src" /usr/local/bin/conch
          which conch
          conch --version

      - name: Set up agnostic environment with min UI
        working-directory: .output/tests/agnostic
        run: conch install --min-ui

      # -- conch summary across every output format --------------------------
      - name: Print summary in human-readable form
        working-directory: .output/tests/agnostic
        run: conch summary

      - name: Export summary as JSON
        working-directory: .output/tests/agnostic
        run: conch summary --format json

      - name: Export summary as YAML
        working-directory: .output/tests/agnostic
        run: conch summary --format yaml

      - name: Export summary as TOML
        working-directory: .output/tests/agnostic
        run: conch summary --format toml

      - name: Export summary as XML
        working-directory: .output/tests/agnostic
        run: conch summary --format xml

      # -- conch tasks across every output format ----------------------------
      - name: List tasks in human-readable form
        working-directory: .output/tests/agnostic
        run: conch tasks

      - name: Export tasks as JSON
        working-directory: .output/tests/agnostic
        run: conch tasks --format json

      - name: Export tasks as YAML
        working-directory: .output/tests/agnostic
        run: conch tasks --format yaml

      - name: Export tasks as TOML
        working-directory: .output/tests/agnostic
        run: conch tasks --format toml

      - name: Export tasks as XML
        working-directory: .output/tests/agnostic
        run: conch tasks --format xml

      # -- conch run under both UI modes -------------------------------------
      - name: Run hello task with min UI
        working-directory: .output/tests/agnostic
        run: conch run hello --min-ui

      - name: Run PowerShell version task with default UI
        working-directory: .output/tests/agnostic
        run: conch run psversion
