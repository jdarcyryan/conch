name: Test

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'goreleaser.yaml'
      - 'winres/**'
      - 'tests/**'
      - '.github/workflows/**'

# Gating workflow. Runs first-line correctness checks — static analysis,
# formatting, and the Go unit tests. Each per-platform workflow runs in
# parallel against the same PR; configure branch protection to require
# this one before merge so the expensive install matrix only matters
# when the basics pass.

jobs:
  test:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run static checks and unit tests
        run: go run ./build/test
