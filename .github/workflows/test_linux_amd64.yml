name: Test Linux amd64

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'goreleaser.yaml'
      - 'winres/**'
      - 'tests/**'
      - '.github/workflows/**'

# Linux amd64 coverage. The richest of the per-platform workflows
# because it hosts the .deb/.rpm/.apk install checks and the
# command-coverage suite (summary, tasks, run in every format and UI
# mode). Two jobs in parallel:
#
#   - binary_and_commands: builds the native binary with `go build`,
#     drives the install fixtures, then exercises every other CLI
#     command against the agnostic environment.
#   - package_install:     drives `go run ./build` to produce real
#     nfpm artifacts, then installs each one on its native distro
#     and asserts `which conch` resolves.

jobs:
  binary_and_commands:
    name: Binary install and command coverage on Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Show platform banner
        run: |
          printf '\033[1;36m========================================\n'
          printf '  Binary install on Linux amd64\n'
          printf '========================================\033[0m\n'

      - name: Build conch for Linux amd64
        run: go build -o conch ./cmd/conch

      - name: Install conch onto PATH
        run: |
          set -euxo pipefail
          sudo install -m 0755 conch /usr/local/bin/conch
          which conch
          conch --version

      - name: Scaffold test fixtures into RUNNER_TEMP
        run: |
          set -euxo pipefail
          for f in tests/*.toml; do
            name=$(basename "$f" .toml)
            mkdir -p "$RUNNER_TEMP/$name"
            cp "$f" "$RUNNER_TEMP/$name/conch.toml"
          done

      - name: Install cross-platform environment
        working-directory: ${{ runner.temp }}/agnostic
        run: conch install --min-ui

      - name: Install Linux amd64 environment
        working-directory: ${{ runner.temp }}/linux-amd64
        run: conch install --min-ui

      # -- summary across every output format --------------------------------
      - name: Print summary in human-readable form
        working-directory: ${{ runner.temp }}/agnostic
        run: conch summary

      - name: Export summary as JSON
        working-directory: ${{ runner.temp }}/agnostic
        run: conch summary --format json

      - name: Export summary as YAML
        working-directory: ${{ runner.temp }}/agnostic
        run: conch summary --format yaml

      - name: Export summary as TOML
        working-directory: ${{ runner.temp }}/agnostic
        run: conch summary --format toml

      - name: Export summary as XML
        working-directory: ${{ runner.temp }}/agnostic
        run: conch summary --format xml

      # -- tasks across every output format ----------------------------------
      - name: List tasks in human-readable form
        working-directory: ${{ runner.temp }}/agnostic
        run: conch tasks

      - name: Export tasks as JSON
        working-directory: ${{ runner.temp }}/agnostic
        run: conch tasks --format json

      - name: Export tasks as YAML
        working-directory: ${{ runner.temp }}/agnostic
        run: conch tasks --format yaml

      - name: Export tasks as TOML
        working-directory: ${{ runner.temp }}/agnostic
        run: conch tasks --format toml

      - name: Export tasks as XML
        working-directory: ${{ runner.temp }}/agnostic
        run: conch tasks --format xml

      # -- run under both UI modes -------------------------------------------
      - name: Run hello task with min UI
        working-directory: ${{ runner.temp }}/agnostic
        run: conch run hello --min-ui

      - name: Run PowerShell version task with default UI
        working-directory: ${{ runner.temp }}/agnostic
        run: conch run psversion

  package_install:
    name: Package install on Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Build all packages
        run: go run ./build

      - name: Show deb banner
        run: |
          printf '\033[1;32m================================\n'
          printf '  Install deb package on Ubuntu\n'
          printf '================================\033[0m\n'

      - name: Install deb package on Ubuntu and verify PATH
        run: |
          set -euxo pipefail
          sudo dpkg -i .output/release/conch_*_amd64.deb
          which conch
          conch --version

      - name: Show rpm banner
        run: |
          printf '\033[1;31m======================================\n'
          printf '  Install rpm package on Rocky Linux 9\n'
          printf '======================================\033[0m\n'

      - name: Install rpm package on Rocky Linux 9 and verify PATH
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${PWD}:/work" \
            -w /work \
            rockylinux:9 \
            sh -c '
              set -eux
              dnf install -y /work/.output/release/conch_*_amd64.rpm
              which conch
              conch --version
            '

      - name: Show apk banner
        run: |
          printf '\033[1;35m================================\n'
          printf '  Install apk package on Alpine\n'
          printf '================================\033[0m\n'

      - name: Install apk package on Alpine and verify PATH
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${PWD}:/work" \
            -w /work \
            alpine:latest \
            sh -c '
              set -eux
              apk add --allow-untrusted /work/.output/release/conch_*_amd64.apk
              which conch
              conch --version
            '
