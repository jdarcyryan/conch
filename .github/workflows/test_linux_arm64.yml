name: Test Linux arm64

on:
  workflow_run:
    workflows: [Test]
    types:
      - completed

# Linux arm64 coverage. Gated on the Test workflow completing
# successfully — the job below short-circuits otherwise. Native build
# on an ARM runner, no cross-compile required. Drives `conch install
# --min-ui` against the platform-agnostic fixture and the arm64-locked
# fixture.

jobs:
  binary_install:
    name: Binary install on Linux arm64
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Show platform banner
        run: |
          printf '\033[1;35m========================================\n'
          printf '  Binary install on Linux arm64\n'
          printf '========================================\033[0m\n'

      - name: Build conch for Linux arm64
        run: go build -o conch ./cmd/conch

      - name: Install conch onto PATH
        run: |
          set -euxo pipefail
          sudo install -m 0755 conch /usr/local/bin/conch
          which conch
          conch --version

      - name: Scaffold test fixtures into RUNNER_TEMP
        run: |
          set -euxo pipefail
          for f in tests/*.toml; do
            name=$(basename "$f" .toml)
            mkdir -p "$RUNNER_TEMP/$name"
            cp "$f" "$RUNNER_TEMP/$name/conch.toml"
          done

      - name: Install cross-platform environment
        working-directory: ${{ runner.temp }}/agnostic
        run: conch install --min-ui

      - name: Check that conch added .conch/ to .gitignore
        working-directory: ${{ runner.temp }}/agnostic
        run: |
          set -euxo pipefail
          test -f .gitignore
          grep -Fxq '.conch/' .gitignore

      - name: Install Linux arm64 environment
        working-directory: ${{ runner.temp }}/linux-arm64
        run: conch install --min-ui
