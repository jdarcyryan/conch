# output.toml
#
# The optional [output] table controls how conch CLI commands render
# progress and status. When unset, conch picks "auto" — TUI when stdout
# is a terminal, plain timestamped log lines otherwise (CI, piped
# output, etc.).
#
# This is overridable per-invocation with --log or --tui on the
# command line. Resolution order:
#
#   command-line flag  >  conch.toml [output].mode  >  auto-detect

[project]
name = "output-config"
version = "0.1.0"

[powershell]
version = "7.5.6"

[modules]
Pester = "5.7.1"

[output]
# Allowed values:
#   "tui"  — colourful single-line progress bars (default for terminals)
#   "log"  — timestamped, level-prefixed lines (default for non-TTY)
#   "auto" — pick at runtime based on whether stdout is a terminal
mode = "auto"
