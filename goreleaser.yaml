# GoReleaser config — https://goreleaser.com
version: 2

# Project metadata
dist: ./.output

# Pre-build setup
before:
  hooks:
    - go mod tidy
    - go-winres make --in winres/winres.json --file-version "{{ .Version }}" --product-version "{{ .Version }}"

# Manually incremented versioning
snapshot:
  version_template: 1.0.0

# Build
# Compiles the Go binary for each OS/arch combination.
builds:
  - main: ./cmd/conch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Strip debug info and inject version metadata into the binary.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

# Package
# Archives: portable .tar.gz / .zip downloads.
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

# Linux native packages: Debian, Red Hat, Alpine.
nfpms:
  - file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    vendor: jdarcyryan
    maintainer: jdarcyryan
    homepage: https://github.com/jdarcyryan/conch
    description: Declarative PowerShell environment manager written in Go.
    license: Apache-2.0

# Chocolatey package (.nupkg). Generated locally; not pushed.
chocolateys:
  - name: conch
    title: Conch Environment Manager
    authors: jdarcyryan
    project_url: https://github.com/jdarcyryan/conch
    # Icon and license URLs are pinned to a commit SHA (jsDelivr caches permanently,
    # so branch URLs are discouraged). Only needs updating if the icon changes.
    icon_url: https://cdn.jsdelivr.net/gh/jdarcyryan/conch@58b07c1e6131e6baaeef0add074f0ae5f67fd5cf/assets/conch_icon_256x256.png
    copyright: Copyright 2026 jdarcyryan
    license_url: https://github.com/jdarcyryan/conch/blob/58b07c1e6131e6baaeef0add074f0ae5f67fd5cf/LICENSE
    project_source_url: https://github.com/jdarcyryan/conch
    package_source_url: https://github.com/jdarcyryan/conch
    docs_url: https://github.com/jdarcyryan/conch/blob/main/README.md
    bug_tracker_url: https://github.com/jdarcyryan/conch/issues
    tags: environment-management environment-manager go golang nuget package-management package-manager powershell pwsh
    summary: Declarative PowerShell environment manager written in Go.
    # Blank lines between paragraphs are required: Chocolatey renders the
    # description as Markdown, where single newlines collapse into one paragraph.
    description: |
      Conch is a cross-platform, declarative PowerShell environment manager written in Go.

      Describe your PowerShell versions and modules in a single TOML file.

      This package supports 64-bit Windows only.
    release_notes: "https://github.com/jdarcyryan/conch/releases/tag/{{ .Version }}"
    url_template: 'https://github.com/jdarcyryan/conch/releases/download/{{ .Version }}/{{ .ArtifactName }}'
    skip_publish: true

# Checksums
checksum:
  name_template: "checksums.txt"
  algorithm: sha256
