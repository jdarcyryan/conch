version: 2

project_name: conch
dist: ./.output/dist

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    formats: [tar.gz]

nfpms:
  - vendor: jdarcyryan
    homepage: https://github.com/jdarcyryan/conch
    maintainer: jdarcyryan
    description: Declarative PowerShell environment manager written in Go.
    license: Apache-2.0
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
