version: 2

project_name: conch
dist: ./.output

before:
  hooks:
    - go mod tidy

snapshot:
  version_template: 0.1.0

builds:
  - main: ./cli
    no_unique_dist_dir: true
    binary: "bin/{{ .Os }}_{{ .Arch }}/conch"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - name_template: "dist/{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    formats: [tar.gz]

nfpms:
  - vendor: jdarcyryan
    homepage: https://github.com/jdarcyryan/conch
    maintainer: jdarcyryan
    description: Declarative PowerShell environment manager written in Go.
    license: Apache-2.0
    file_name_template: "dist/{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
