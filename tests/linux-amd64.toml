# linux-amd64.toml
#
# CI fixture: restricted to Linux on amd64. Installs cleanly on an
# ubuntu-latest runner; conch must refuse it on any other platform.

[project]
name = "linux-amd64"
platforms = ["linux-amd64"]

[powershell]
version = "7.5.6"

[modules]
Pester = "5.7.1"
PSScriptAnalyzer = "1.25.0"
