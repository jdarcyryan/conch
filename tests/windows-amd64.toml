# windows-amd64.toml
#
# CI fixture: restricted to Windows on amd64. Installs cleanly on a
# windows-latest runner; conch must refuse it on any other platform.

[project]
name = "windows-amd64"
platforms = ["windows-amd64"]

[powershell]
version = "7.5.6"

[modules]
Pester = "5.7.1"
PSScriptAnalyzer = "1.25.0"
