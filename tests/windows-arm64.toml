# windows-arm64.toml
#
# CI fixture: restricted to Windows on arm64. Installs cleanly on a
# windows-11-arm runner; conch must refuse it on any other platform.

[project]
name = "windows-arm64"
platforms = ["windows-arm64"]

[powershell]
version = "7.5.6"

[modules]
Pester = "5.7.1"
PSScriptAnalyzer = "1.25.0"
